<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="800" viewBox="0 0 1120 800" role="img" aria-labelledby="title desc">
  <title id="title">A: Other schemas — Unrelated schema growth</title>
  <desc id="desc">One PostgreSQL database contains target tenant_000, N unrelated tenant schemas, and shared bench_types. N is 1, 20, 60, or 150: N plus 1 tenant schemas, excluding bench_types. One built, unqueried Graphile instance stays fixed. Separate Stock and Scoped runs compare broad catalogue metadata with target metadata and required cross-schema dependencies. Scoped catalogTypes=all also includes all pg_catalog types. The fixture sketch shows table relationships, not data rows. This is not a concurrent-request load test.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172b43; }
      .title { font-size: 30px; font-weight: 700; }
      .heading { font-size: 22px; font-weight: 700; }
      .label { font-size: 16px; font-weight: 700; letter-spacing: 1px; }
      .body { font-size: 19px; }
      .small { font-size: 17px; }
      .muted { fill: #41566f; }
      .blue { fill: #154e83; }
      .green { fill: #12684e; }
      .line { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1120" height="800" rx="16" fill="#ffffff"/>
  <text x="32" y="49" class="title">A · Other schemas</text>
  <text x="32" y="78" class="body muted">Unrelated schema growth</text>

  <rect x="32" y="100" width="400" height="64" rx="10" fill="#eaf3ff"/>
  <text x="50" y="125" class="label blue">FIXED</text>
  <text x="50" y="149" class="body">1 target · 1 retained Graphile instance</text>
  <rect x="448" y="100" width="640" height="64" rx="10" fill="#fff3dd"/>
  <text x="466" y="125" class="label">VARYING · OTHER SCHEMAS</text>
  <text x="466" y="149" class="body">N = 1 / 20 / 60 / 150 · total tenant schemas = N + 1</text>

  <rect x="32" y="188" width="530" height="296" rx="12" fill="#f8fafc" stroke="#bdcbd9" stroke-width="2"/>
  <text x="52" y="220" class="heading">One PostgreSQL database</text>
  <rect x="52" y="240" width="232" height="82" rx="8" fill="#eaf3ff" stroke="#8eb7e1"/>
  <text x="68" y="269" class="heading blue">tenant_000</text>
  <text x="68" y="299" class="small">Target schema · fixed</text>
  <rect x="302" y="240" width="240" height="82" rx="8" fill="#fff3dd" stroke="#dec28b"/>
  <text x="318" y="269" class="heading">N other schemas</text>
  <text x="318" y="299" class="small">Unrelated tenant schemas</text>
  <rect x="52" y="340" width="490" height="90" rx="8" fill="#eaf7f1" stroke="#8cc4ad"/>
  <text x="68" y="369" class="heading green">bench_types · shared dependencies</text>
  <text x="68" y="398" class="small">Extra schema; excluded from the N + 1 tenant count</text>
  <text x="52" y="459" class="small muted">PostgreSQL system catalogues are also present.</text>

  <path d="M 562 335 H 626" class="line"/>
  <rect x="642" y="188" width="446" height="296" rx="12" fill="#f8fafc" stroke="#bdcbd9" stroke-width="2"/>
  <text x="662" y="220" class="heading">One retained Graphile instance</text>
  <text x="662" y="247" class="small muted">tenant_000 · built, unqueried · same SDL</text>
  <text x="662" y="279" class="label">METADATA · STOCK OR SCOPED</text>
  <text x="662" y="303" class="small muted">Compared in separate runs</text>
  <rect x="662" y="319" width="406" height="58" rx="8" fill="#fff3dd"/>
  <text x="678" y="342" class="body">Stock: broad catalogue metadata</text>
  <text x="678" y="365" class="small">Includes unrelated schemas</text>
  <rect x="662" y="389" width="406" height="77" rx="8" fill="#eaf7f1"/>
  <text x="678" y="412" class="body">Scoped: target + required dependencies</text>
  <text x="678" y="434" class="small">Cross-schema dependencies are included;</text>
  <text x="678" y="455" class="small">catalogTypes=all adds all pg_catalog types.</text>

  <rect x="32" y="508" width="1056" height="214" rx="12" fill="#f8fafc" stroke="#bdcbd9"/>
  <text x="52" y="538" class="heading">Fixture sketch · repeated in each tenant</text>
  <text x="52" y="563" class="small muted">Core parent → child relationships; table names, not data rows</text>
  <rect x="52" y="579" width="144" height="44" rx="7" fill="#eaf3ff"/>
  <text x="124" y="607" text-anchor="middle" class="body">accounts</text>
  <path d="M 201 601 H 224" class="line"/>
  <rect x="232" y="579" width="144" height="44" rx="7" fill="#eaf3ff"/>
  <text x="304" y="607" text-anchor="middle" class="body">projects</text>
  <path d="M 381 601 H 404" class="line"/>
  <rect x="412" y="579" width="132" height="44" rx="7" fill="#eaf3ff"/>
  <text x="478" y="607" text-anchor="middle" class="body">tasks</text>
  <path d="M 549 601 H 577" class="line"/>
  <rect x="585" y="579" width="483" height="44" rx="7" fill="#eaf3ff"/>
  <text x="826" y="607" text-anchor="middle" class="body">notes · events · attachments</text>
  <text x="52" y="656" class="small">Also: tags via task_tags · settings · inherited_records inherits bench_types.record_base</text>
  <text x="52" y="690" class="small">Shared: priority (FK / enum table), score, score_range, mood (via functions)</text>

  <text x="32" y="760" class="body">Schema metadata grows with N; this is not a data-row or concurrent-request load test.</text>
</svg>
