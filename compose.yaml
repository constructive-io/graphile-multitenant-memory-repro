name: graphile-memory-repro
services:
  postgres:
    image: postgres:17.7-bookworm@sha256:86e0b703649d7a792bd9243ee28afc9d8f7c6b2b5638077c9d6882d4d472bbfd
    environment:
      POSTGRES_USER: bench_admin
      POSTGRES_PASSWORD: synthetic-local-only
      POSTGRES_DB: graphile_memory_bench
    ports:
      - "127.0.0.1:${BENCH_PG_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench_admin -d graphile_memory_bench"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - benchmark-data:/var/lib/postgresql/data
volumes:
  benchmark-data:
